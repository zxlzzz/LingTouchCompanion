# LingTouch 端侧默认参数。
# 核心编译时把本文件原样嵌进去（见 core/CMakeLists.txt），安卓、鸿蒙用的是同一份，
# 保证两边对同一帧算出同一张栅格。每个键都必须出现；App 以后可以再传一段覆盖文本。
# 格式：每行"键 = 值"；# 之后是注释；值留空表示"未设定"（只有标明可留空的键允许）。
# 所有门槛都是初版取值，视觉同学可以按实测改。

# ── 深度图 ───────────────────────────────────────────────────────────────
# 深度值含义：optical_z（沿光轴的 Z）或 radial（沿视线的距离）。未确认：
# 材料里查不到依据，真机对着平整的墙做平面检查来判断（docs/device_tests.md）。
depth.meaning = optical_z
# 是否用标定 blob 里的畸变系数去畸变。片上 ASIC 是否已经去过畸变也未确认，平面检查一并比较。
depth.undistort = true
# CS30 深度图本身是否左右镜像。未确认，真机验收时把物体放在左侧看哪一列起来。
depth.image_mirrored = false
# 有效量程（毫米）。0 = 无数据；小于 100 mm 低于标称最小量程；感知按 0–5 m 预留。
depth.min_valid_mm = 100
depth.max_valid_mm = 5000
# 读数恰好为 1（推断是过曝）按无效处理
depth.reject_value_one = true
# 相位绕回（推断）：远处读成近处。一个近点四周 (2r+1)×(2r+1) 窗口里无效像素占比
# 不低于这个比例，且读数不超过 wrap_max_depth_mm，就判无效。
depth.wrap_window_radius_px = 3
depth.wrap_invalid_fraction = 0.7
depth.wrap_max_depth_mm = 1500
# 边缘飞点：3×3 邻域里深度相差不超过 max(abs, rel×深度) 的有效邻居少于这个数就丢掉。
# 0 = 不滤。默认偏松（1），保住细椅腿；这是细障碍回归测试要测的取舍。
depth.flying_min_consistent_neighbors = 1
depth.flying_abs_tolerance_mm = 50
depth.flying_rel_tolerance = 0.05

# ── 地面拟合（第一阶段不用 IMU：镜头离地高度和俯仰、横滚都由地面拟合得到）────────
# 每隔几个像素取一个点参与拟合
ground.sample_stride_px = 4
ground.ransac_iterations = 200
ground.ransac_seed = 1
ground.inlier_distance_m = 0.03
ground.min_inliers = 500
ground.camera_height_min_m = 0.4
ground.camera_height_max_m = 2.2
# 地面法线与相机"向上"方向的最大夹角（大致等于允许的最大俯仰/横滚）
ground.max_tilt_deg = 75
# 内点沿前向至少要铺开这么长，避免拟合到一小块
ground.min_forward_span_m = 0.6
# 低于所拟合平面超过 below_margin 的点占比超过这个值，就认为拟合到的不是地面（例如桌面）
ground.below_margin_m = 0.10
ground.max_below_fraction = 0.05

# ── 9×6 栅格与 0/1/2 ─────────────────────────────────────────────────────
# 障碍高度带（离地，米）
grid.height_band_min_m = 0.10
grid.height_band_max_m = 1.90
# 离地高度绝对值不超过这个值的点算地面点
grid.ground_tolerance_m = 0.05
# 1：高度带内实测点达到这个数（1 优先于 0）
grid.obstacle_min_points = 5
# 0：高度带内点数不超过这个值，且 4×4 个 10 cm 小块都有地面点
grid.free_max_band_points = 0
grid.free_min_ground_points_per_subblock = 1
# 允许缺几个小块，由实测定
grid.free_max_missing_subblocks = 0

# ── 触觉输出（旧板，V2.8 固件）──────────────────────────────────────────
# 状态 2（未知）在触点上表示为平（flat）还是凸（raised）：待 Hsinlung 定。
# 可留空；留空时 App 发帧前必须在界面上手选，不选不能发。
tactile.unknown_cell_policy =
# 发送前左右镜像：沿用现有行为（experiment_server.py 先 mirror_grid_horizontal 再打包，
# 9/29 比赛版 toFrameBytes 也先镜像）。手摸验收确认，见 docs/device_tests.md。
tactile.mirror_left_right = true
# 模组 180° 反装，与 frame_converter.py 的 MODULE_ROT180 一致（真机为 true）
tactile.module_rot180 = true
