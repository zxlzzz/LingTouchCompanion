<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Camera → LingTouch</title>
<style>
body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;overflow:hidden}
video{width:100%;max-width:400px;border-radius:8px;position:fixed;top:0;left:50%;transform:translateX(-50%)}
#status{color:#0f0;font-size:13px;margin-top:8px;position:fixed;bottom:76px;font-family:monospace;z-index:10;text-align:center;width:100%}
#status.warn{color:#ff0}
#status.err{color:#f55}
#count{color:#ff0;font-size:12px;position:fixed;bottom:88px;font-family:monospace;z-index:10}
.btnrow{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
button{padding:12px 32px;font-size:16px;background:#3fb950;color:#000;border:none;border-radius:8px}
button.running{background:#da3633}
#reconnBtn{background:#555;color:#fff;padding:12px 20px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="count">已发送: 0</div>
<div id="status">点击开始</div>
<div class="btnrow">
  <button id="btn" type="button">开始推流</button>
  <button id="reconnBtn" type="button">重连摄像头</button>
</div>
<script>
const statusEl=document.getElementById('status');
const count=document.getElementById('count');
const btn=document.getElementById('btn');
const reconnBtn=document.getElementById('reconnBtn');
const video=document.getElementById('v');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let stream, timer, running=false, sent=0;
let wasRunningBeforeLost=false;
let blackFrameStreak=0;
let reconnecting=false;

const PC_IP=location.hostname;
const URL=`https://${PC_IP}:8760/frame`;

function setStatus(text, level){
  statusEl.textContent=text;
  statusEl.className=level||'';
}

function streamIsLive(){
  const track=stream && stream.getVideoTracks()[0];
  return !!(track && track.readyState==='live');
}

// 摄像头被系统回收（锁屏/切后台/被别的 App 抢占）时，旧 track 会触发 ended，
// 这里主动感知并重连，而不是干等用户发现黑屏再手动处理。
function bindTrackWatch(){
  const track=stream.getVideoTracks()[0];
  track.addEventListener('ended', ()=>{
    if(reconnecting)return;
    setStatus('摄像头连接断开，自动重连中...', 'warn');
    reconnect();
  });
}

async function acquireStream(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
  stream=await navigator.mediaDevices.getUserMedia({
    video:{width:640,height:480,facingMode:'environment'}
  });
  video.srcObject=stream;
  await video.play();
  canvas.width=320;canvas.height=240;
  bindTrackWatch();
}

async function init(){
  try{
    await acquireStream();
    setStatus('已就绪');
  }catch(e){
    setStatus('摄像头失败: '+e.message, 'err');
  }
}

// 统一的"重新拿摄像头"入口：初始化失败、track ended、黑屏看门狗、
// 手动点重连按钮，都走这一条路径，成功后按之前是否在推流自动恢复。
async function reconnect(){
  if(reconnecting)return;
  reconnecting=true;
  wasRunningBeforeLost=running;
  running=false;
  clearTimeout(timer);
  blackFrameStreak=0;
  for(let attempt=1;attempt<=3;attempt++){
    try{
      await acquireStream();
      setStatus('摄像头已重连');
      reconnecting=false;
      if(wasRunningBeforeLost)start();
      return;
    }catch(e){
      setStatus(`重连失败(${attempt}/3): ${e.message}`, 'err');
      await new Promise(r=>setTimeout(r, 1000*attempt));
    }
  }
  reconnecting=false;
  setStatus('自动重连多次失败，请检查摄像头是否被其他 App 占用，或点"重连摄像头"手动重试', 'err');
}

btn.onclick=()=>{
  if(running){stop();return}
  if(!streamIsLive()){init().then(()=>{if(streamIsLive())start()})}
  else start();
};

reconnBtn.onclick=()=>{reconnect();};

// 页面从后台切回来时，摄像头很可能已经被系统掐断（尤其锁屏后），
// 主动探测一次，不要等黑屏 5 秒才被看门狗抓到。
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && !streamIsLive() && !reconnecting){
    setStatus('检测到摄像头已断开，自动重连中...', 'warn');
    reconnect();
  }
});

function start(){
  running=true;sent=0;blackFrameStreak=0;
  btn.textContent='停止推流';
  btn.className='running';
  setStatus('推流中...');
  sendLoop();
}

function stop(){
  running=false;
  btn.textContent='开始推流';
  btn.className='';
  setStatus('已停止');
}

// 黑屏看门狗：不管是什么原因（track 没触发 ended、视频卡死不刷新等），
// 只要画面连续好几帧几乎全黑，就当作"死了"主动重连，兜底所有没被
// 上面几种事件抓到的情况。
function isFrameBlack(imgData){
  const d=imgData.data;
  let sum=0;
  const step=40; // 采样而不是全量算，省点性能
  for(let i=0;i<d.length;i+=step*4){sum+=d[i]+d[i+1]+d[i+2]}
  const n=Math.ceil(d.length/(step*4));
  return (sum/n) < 3; // 均值接近 0 才算黑，正常画面不会这么暗
}

function sendLoop(){
  if(!running)return;
  ctx.drawImage(video,0,0,320,240);

  const sample=ctx.getImageData(0,0,320,240);
  if(isFrameBlack(sample)){
    blackFrameStreak++;
    if(blackFrameStreak>=5 && !reconnecting){ // 连续约1.5秒全黑
      setStatus('画面持续全黑，自动重连中...', 'warn');
      reconnect();
      return;
    }
  }else{
    blackFrameStreak=0;
  }

  canvas.toBlob(blob=>{
    fetch(URL,{method:'POST',body:blob}).then(r=>r.json()).then(d=>{
      sent++;
      count.textContent='已发送: '+sent+' 帧';
      if(!reconnecting)setStatus('推流中 (深度:'+d.active+'/90)');
    }).catch(e=>{
      if(!reconnecting)setStatus('发送失败: '+e.message, 'warn');
    });
    timer=setTimeout(sendLoop,300);
  },'image/jpeg',0.5);
}

init();
</script>
</body>
</html>
